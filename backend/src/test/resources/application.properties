spring.datasource.url=jdbc:h2:mem:vpnex;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Firebase and Supabase are absent in tests; the services degrade to
# "disabled" rather than failing to start.
vpnex.firebase.project-id=test
vpnex.firebase.credentials-path=
vpnex.supabase.url=
vpnex.supabase.service-role-key=
vpnex.encryption.key=
vpnex.web.allowed-origins=http://localhost:*
