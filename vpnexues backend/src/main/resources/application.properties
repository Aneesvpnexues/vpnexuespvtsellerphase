# ---------------------------------------------------------------------------
# Supabase Postgres (JPA)
#
# The real host is db.<project-ref>.supabase.co — NOT db.supabase.co.
# Find the exact URL in Supabase: Settings -> Database -> Connection string
# -> URI. Use the Session pooler (port 6543) if many sellers will connect at
# once, the direct connection (port 5432) for migrations.
# ---------------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

# update: Hibernate creates/alters the tables from the @Entity classes. Once
# the schema settles, switch to validate and add Flyway migrations.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Surface the SQL while wiring things up; comment out before deploying.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# ---------------------------------------------------------------------------
# File uploads (step 04)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---------------------------------------------------------------------------
# vpnex.* — bound into com.vpnex.backend.config.VpnexProperties
# ---------------------------------------------------------------------------
vpnex.supabase.url=${SUPABASE_URL:}
vpnex.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
vpnex.supabase.kyc-bucket=${SUPABASE_KYC_BUCKET:kyc-documents}

vpnex.firebase.project-id=${FIREBASE_PROJECT_ID:}
# Read from the environment, never from a file inside the repo.
vpnex.firebase.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}

vpnex.kyc.max-file-size-bytes=10485760
vpnex.kyc.allowed-extensions=pdf,jpg,jpeg,png,webp,heic

# Base64 of a 16/24/32 byte AES key, for encrypting bank account numbers.
# Generate one with: python -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
vpnex.encryption.key=${VPNEX_ENCRYPTION_KEY:}

vpnex.web.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://10.0.2.2:*,http://192.168.0.0/16}

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
