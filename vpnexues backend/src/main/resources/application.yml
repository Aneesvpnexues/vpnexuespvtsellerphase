spring:
  application:
    name: seller-backend
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  jwks-url: ${SUPABASE_JWKS_URL:${SUPABASE_URL}/auth/v1/.well-known/jwks.json}
  issuer: ${SUPABASE_ISSUER:${SUPABASE_URL}/auth/v1}
  connect-timeout: 3s
  read-timeout: 10s
